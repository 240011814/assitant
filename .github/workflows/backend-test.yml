name: Backend Test

on:
  push:
    branches: [english]
    paths: ['backend/**', '.github/workflows/backend-test.yml']
  pull_request:
    branches: [english]
    paths: ['backend/**', '.github/workflows/backend-test.yml']

jobs:
  test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./... -count=1
