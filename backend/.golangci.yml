version: "2"

linters:
  # standard = errcheck + govet + ineffassign + staticcheck + unused
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # defer 关闭资源是惯用法, 关闭失败已无后续动作可做
        - (net.Conn).Close
        - (*net/smtp.Client).Close
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (mime/multipart.File).Close
    staticcheck:
      checks:
        - all
        # 错误串面向中文用户, 不适用英文首字母小写规范
        - -ST1005
        # 以下与 golangci 默认关闭项保持一致 (文档注释/名称风格类, 存量代码不满足)
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
